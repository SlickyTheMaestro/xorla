<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Xorla: run your business without wahala</title>
    <meta name="description" content="Sales, stock, bookings, staff and payments, all on your phone. Free plan for small businesses, and 30 days of Pro free." />

    <!-- How links to Xorla look when shared on WhatsApp, Facebook, X and LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xorla" />
    <meta property="og:title" content="Xorla: run your business without wahala" />
    <meta property="og:description" content="Sales, stock, bookings, staff and payments, all on your phone. Free to start." />
    <meta property="og:url" content="https://xorla.vercel.app/" />
    <meta property="og:image" content="https://xorla.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Home page and rider pages: bold headings (Unbounded), easy reading (Poppins), receipts (IBM Plex Mono) -->

    <!-- Installability: manifest + icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theming: matches the app's own dark background, no white flash on launch -->
    <meta name="theme-color" content="#0A1F1C" />
    <script>
      // Light or dark mode before the page paints, so there's no flash (owner/staff app and founder dashboard only)
      try { var xp = location.pathname.replace(/\/+$/, ''); if (xp === '' || xp === '/login' || xp === '/admin') { var xt = localStorage.getItem('xorla:theme'); if (xt === 'auto') xt = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; if (xt === 'light') { document.documentElement.setAttribute('data-xt', 'light'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F1F5F2'); } } } catch (e) {}
    </script>

    <!-- Android: launch as a standalone app -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari: launch full-screen from the home screen, no browser chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xorla" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
